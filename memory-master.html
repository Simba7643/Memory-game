<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Master</title>
<style>
  :root {
    --navy: #070b1a;
    --navy-mid: #0f1830;
    --navy-light: #182449;
    --gold: #d4af37;
    --gold-light: #f4d976;
    --gold-glow: rgba(212, 175, 55, 0.55);
    --text: #e8e8f2;
    --muted: #8a93b8;
    --danger: #e05a5a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(212,175,55,0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(212,175,55,0.06), transparent 40%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-mid) 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px 60px;
    color: var(--text);
    overflow-x: hidden;
    position: relative;
  }

  .title-wrap { text-align: center; margin-bottom: 18px; }

  h1 {
    color: var(--gold);
    letter-spacing: 4px;
    font-size: 2.2rem;
    text-shadow: 0 0 18px var(--gold-glow);
  }

  .subtitle { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

  .panel {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 18px;
  }

  .pill-group {
    display: flex;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 30px;
    padding: 4px;
    gap: 4px;
  }

  .pill-group button {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 8px 16px;
    border-radius: 24px;
    cursor: pointer;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    transition: 0.25s;
  }

  .pill-group button.active {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: var(--navy);
    font-weight: 700;
    box-shadow: 0 0 14px var(--gold-glow);
  }

  .pill-group button:hover:not(.active) { color: var(--gold-light); }

  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 22px;
  }

  .stat-card {
    background: rgba(212, 175, 55, 0.06);
    border: 1px solid rgba(212, 175, 55, 0.3);
    padding: 10px 20px;
    border-radius: 14px;
    text-align: center;
    min-width: 90px;
  }

  .stat-card .label {
    display: block;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .stat-card .value {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--gold-light);
  }

  .board {
    display: grid;
    gap: 10px;
    width: 100%;
  }

  .board.size-4 { max-width: 420px; grid-template-columns: repeat(4, 1fr); }
  .board.size-6 { max-width: 560px; grid-template-columns: repeat(6, 1fr); }

  .card { aspect-ratio: 1 / 1; perspective: 800px; cursor: pointer; }

  .card-inner {
    position: relative;
    width: 100%; height: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.2rem, 4vw, 1.9rem);
  }

  .card-front {
    background: linear-gradient(145deg, var(--navy-light), #1f2b4d);
    border: 2px solid rgba(212, 175, 55, 0.3);
    transition: border-color 0.25s, box-shadow 0.25s;
  }

  .card:hover .card-front {
    border-color: rgba(212, 175, 55, 0.7);
    box-shadow: 0 0 12px rgba(212,175,55,0.25);
  }

  .card-front::after { content: "?"; color: rgba(212, 175, 55, 0.45); font-weight: 700; }

  .card-back {
    background: linear-gradient(145deg, var(--gold-light), var(--gold));
    color: var(--navy);
    transform: rotateY(180deg);
    font-weight: 700;
  }

  .card.matched .card-back {
    box-shadow: 0 0 18px rgba(212, 175, 55, 0.8);
    animation: pulse 1.2s ease-in-out infinite;
  }

  .card.wrong .card-inner { animation: shake 0.4s ease; }

  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.15); }
  }

  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-6px); }
    75% { transform: rotateY(180deg) translateX(6px); }
  }

  .controls { margin-top: 26px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

  button.action {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 10px 24px;
    border-radius: 24px;
    cursor: pointer;
    font-size: 0.9rem;
    letter-spacing: 1px;
    transition: 0.25s;
  }

  button.action:hover {
    background: var(--gold);
    color: var(--navy);
    box-shadow: 0 0 16px var(--gold-glow);
  }

  .win-banner {
    margin-top: 22px;
    text-align: center;
    padding: 16px 28px;
    border-radius: 16px;
    background: rgba(212,175,55,0.08);
    border: 1px solid rgba(212,175,55,0.35);
    min-height: 0;
    max-width: 480px;
    display: none;
  }

  .win-banner.show { display: block; }

  .win-banner .headline {
    color: var(--gold-light);
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .win-banner .detail { color: var(--muted); font-size: 0.9rem; }

  .best-tag {
    display: inline-block;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: var(--navy);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .confetti {
    position: fixed;
    top: -10px;
    width: 8px; height: 14px;
    opacity: 0.9;
    pointer-events: none;
    z-index: 999;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  .streak-flash {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: var(--navy);
    padding: 8px 20px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.85rem;
    opacity: 0;
    transition: 0.35s;
    pointer-events: none;
    z-index: 1000;
  }

  .streak-flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    h1 { font-size: 1.6rem; letter-spacing: 2px; }
    .stat-card { min-width: 70px; padding: 8px 12px; }
  }
</style>
</head>
<body>

<div class="streak-flash" id="streakFlash"></div>

<div class="title-wrap">
  <h1>MEMORY MASTER</h1>
  <p class="subtitle">Match the pairs. Beat your best. Chase the streak.</p>
</div>

<div class="panel">
  <div class="pill-group" id="difficultyGroup">
    <button data-size="4" class="active">Classic 4×4</button>
    <button data-size="6">Advanced 6×6</button>
  </div>
  <div class="pill-group" id="soundGroup">
    <button data-sound="on" class="active">🔊 Sound On</button>
    <button data-sound="off">🔇 Sound Off</button>
  </div>
</div>

<div class="stats">
  <div class="stat-card"><span class="label">Moves</span><span class="value" id="moves">0</span></div>
  <div class="stat-card"><span class="label">Time</span><span class="value" id="timer">0s</span></div>
  <div class="stat-card"><span class="label">Pairs</span><span class="value" id="pairs">0/8</span></div>
  <div class="stat-card"><span class="label">Streak</span><span class="value" id="streak">0</span></div>
  <div class="stat-card"><span class="label">Best</span><span class="value" id="best">—</span></div>
</div>

<div class="board size-4" id="board"></div>

<div class="controls">
  <button class="action" id="restartBtn">Restart</button>
  <button class="action" id="hintBtn">Peek (1x)</button>
</div>

<div class="win-banner" id="winBanner">
  <div class="headline" id="winHeadline"></div>
  <div class="detail" id="winDetail"></div>
</div>

<script>
  const ICON_SET = ['♠','♥','♦','♣','★','☀','☾','⚡','♞','♛','⚛','☯','✦','❖','☘','⌘','◆','⬢'];

  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const pairsEl = document.getElementById('pairs');
  const streakEl = document.getElementById('streak');
  const bestEl = document.getElementById('best');
  const winBanner = document.getElementById('winBanner');
  const winHeadline = document.getElementById('winHeadline');
  const winDetail = document.getElementById('winDetail');
  const restartBtn = document.getElementById('restartBtn');
  const hintBtn = document.getElementById('hintBtn');
  const streakFlash = document.getElementById('streakFlash');
  const difficultyGroup = document.getElementById('difficultyGroup');
  const soundGroup = document.getElementById('soundGroup');

  let gridSize = 4;
  let soundOn = true;
  let symbols = [];
  let flippedCards = [];
  let matchedCount = 0;
  let moves = 0;
  let timer = 0;
  let timerInterval = null;
  let lockBoard = false;
  let streak = 0;
  let bestStreak = 0;
  let hintUsed = false;

  let audioCtx = null;
  function beep(freq, duration, type = 'sine') {
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function bestKey() { return `memoryMaster_best_${gridSize}`; }

  function loadBest() {
    const val = localStorage.getItem(bestKey());
    bestEl.textContent = val ? val + ' moves' : '—';
  }

  function saveBestIfNeeded() {
    const current = localStorage.getItem(bestKey());
    if (!current || moves < parseInt(current, 10)) {
      localStorage.setItem(bestKey(), moves);
      loadBest();
      return true;
    }
    return false;
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function startTimer() {
    clearInterval(timerInterval);
    timer = 0;
    timerEl.textContent = '0s';
    timerInterval = setInterval(() => {
      timer++;
      timerEl.textContent = timer + 's';
    }, 1000);
  }

  function flashStreak(text) {
    streakFlash.textContent = text;
    streakFlash.classList.add('show');
    setTimeout(() => streakFlash.classList.remove('show'), 900);
  }

  function launchConfetti() {
    const colors = ['#d4af37', '#f4d976', '#ffffff', '#8a93b8'];
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      piece.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 3600);
    }
  }

  function createBoard() {
    board.className = 'board size-' + gridSize;
    board.innerHTML = '';
    winBanner.classList.remove('show');
    moves = 0;
    matchedCount = 0;
    flippedCards = [];
    lockBoard = false;
    streak = 0;
    hintUsed = false;
    hintBtn.disabled = false;
    hintBtn.style.opacity = '1';
    movesEl.textContent = '0';
    streakEl.textContent = '0';

    const pairCount = (gridSize * gridSize) / 2;
    symbols = ICON_SET.slice(0, pairCount);
    pairsEl.textContent = '0/' + pairCount;

    const deck = shuffle([...symbols, ...symbols]);

    deck.forEach((symbol) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.symbol = symbol;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front"></div>
          <div class="card-face card-back">${symbol}</div>
        </div>
      `;

      card.addEventListener('click', () => handleCardClick(card));
      board.appendChild(card);
    });

    loadBest();
    startTimer();
  }

  function handleCardClick(card) {
    if (lockBoard) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if (flippedCards.length === 2) return;

    card.classList.add('flipped');
    beep(520, 0.08);
    flippedCards.push(card);

    if (flippedCards.length === 2) {
      moves++;
      movesEl.textContent = moves;
      checkMatch();
    }
  }

  function checkMatch() {
    const [first, second] = flippedCards;
    const isMatch = first.dataset.symbol === second.dataset.symbol;

    if (isMatch) {
      first.classList.add('matched');
      second.classList.add('matched');
      matchedCount++;
      streak++;
      if (streak > bestStreak) bestStreak = streak;
      streakEl.textContent = streak;
      pairsEl.textContent = matchedCount + '/' + symbols.length;
      flippedCards = [];
      beep(760, 0.12, 'triangle');

      if (streak >= 3) flashStreak(`🔥 ${streak}x Streak!`);

      if (matchedCount === symbols.length) {
        clearInterval(timerInterval);
        const isBest = saveBestIfNeeded();
        winHeadline.textContent = '🏆 Board Cleared!';
        winDetail.innerHTML = `${moves} moves · ${timer}s · best streak ${bestStreak}` +
          (isBest ? '<div class="best-tag">NEW BEST</div>' : '');
        winBanner.classList.add('show');
        launchConfetti();
        beep(1000, 0.3, 'sawtooth');
      }
    } else {
      streak = 0;
      streakEl.textContent = '0';
      lockBoard = true;
      first.classList.add('wrong');
      second.classList.add('wrong');
      beep(180, 0.2, 'sawtooth');
      setTimeout(() => {
        first.classList.remove('flipped', 'wrong');
        second.classList.remove('flipped', 'wrong');
        flippedCards = [];
        lockBoard = false;
      }, 800);
    }
  }

  function peekHint() {
    if (hintUsed || lockBoard) return;
    hintUsed = true;
    hintBtn.disabled = true;
    hintBtn.style.opacity = '0.4';
    const unmatched = [...board.querySelectorAll('.card:not(.matched)')];
    unmatched.forEach(c => c.classList.add('flipped'));
    lockBoard = true;
    setTimeout(() => {
      unmatched.forEach(c => {
        if (!c.classList.contains('matched')) c.classList.remove('flipped');
      });
      lockBoard = false;
    }, 1200);
  }

  difficultyGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    [...difficultyGroup.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gridSize = parseInt(btn.dataset.size, 10);
    createBoard();
  });

  soundGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    [...soundGroup.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    soundOn = btn.dataset.sound === 'on';
  });

  restartBtn.addEventListener('click', createBoard);
  hintBtn.addEventListener('click', peekHint);

  createBoard();
</script>

</body>
</html>
