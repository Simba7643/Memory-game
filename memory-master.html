<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Card Game</title>
<style>
  :root {
    --navy: #0a1128;
    --navy-light: #16213e;
    --gold: #d4af37;
    --gold-light: #f4d976;
    --text: #e8e8e8;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, var(--navy-light), var(--navy) 70%);
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
    color: var(--text);
  }

  h1 {
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
  }

  .subtitle {
    color: #9aa4c0;
    margin-bottom: 20px;
    font-size: 0.95rem;
  }

  .stats {
    display: flex;
    gap: 24px;
    margin-bottom: 20px;
    background: rgba(212, 175, 55, 0.08);
    border: 1px solid rgba(212, 175, 55, 0.3);
    padding: 10px 24px;
    border-radius: 30px;
    font-size: 0.95rem;
  }

  .stats span {
    color: var(--gold-light);
    font-weight: 600;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 420px;
    width: 100%;
  }

  .card {
    aspect-ratio: 1 / 1;
    perspective: 800px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
  }

  .card-front {
    background: linear-gradient(145deg, var(--navy-light), #1f2b4d);
    border: 2px solid rgba(212, 175, 55, 0.35);
  }

  .card-front::after {
    content: "★";
    color: rgba(212, 175, 55, 0.4);
    font-size: 1.4rem;
  }

  .card-back {
    background: linear-gradient(145deg, var(--gold-light), var(--gold));
    color: var(--navy);
    transform: rotateY(180deg);
    font-weight: 700;
  }

  .card.matched .card-back {
    box-shadow: 0 0 18px rgba(212, 175, 55, 0.7);
  }

  .controls {
    margin-top: 24px;
    display: flex;
    gap: 14px;
  }

  button {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 10px 22px;
    border-radius: 24px;
    cursor: pointer;
    font-size: 0.9rem;
    letter-spacing: 1px;
    transition: 0.25s;
  }

  button:hover {
    background: var(--gold);
    color: var(--navy);
    box-shadow: 0 0 14px rgba(212, 175, 55, 0.5);
  }

  .win-message {
    margin-top: 18px;
    color: var(--gold-light);
    font-size: 1.1rem;
    text-align: center;
    min-height: 1.4em;
  }
</style>
</head>
<body>

<h1>MEMORY</h1>
<p class="subtitle">Match every pair in as few moves as you can</p>

<div class="stats">
  <div>Moves: <span id="moves">0</span></div>
  <div>Time: <span id="timer">0s</span></div>
  <div>Pairs: <span id="pairs">0/8</span></div>
</div>

<div class="board" id="board"></div>

<div class="controls">
  <button id="restartBtn">Restart</button>
</div>

<div class="win-message" id="winMessage"></div>

<script>
  const symbols = ['♠', '♥', '♦', '♣', '★', '☀', '☾', '⚡'];
  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const pairsEl = document.getElementById('pairs');
  const winMessage = document.getElementById('winMessage');
  const restartBtn = document.getElementById('restartBtn');

  let cards = [];
  let flippedCards = [];
  let matchedCount = 0;
  let moves = 0;
  let timer = 0;
  let timerInterval = null;
  let lockBoard = false;

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function startTimer() {
    clearInterval(timerInterval);
    timer = 0;
    timerEl.textContent = '0s';
    timerInterval = setInterval(() => {
      timer++;
      timerEl.textContent = timer + 's';
    }, 1000);
  }

  function createBoard() {
    board.innerHTML = '';
    winMessage.textContent = '';
    moves = 0;
    matchedCount = 0;
    flippedCards = [];
    lockBoard = false;
    movesEl.textContent = '0';
    pairsEl.textContent = '0/' + symbols.length;

    const deck = shuffle([...symbols, ...symbols]);

    cards = deck.map((symbol, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.symbol = symbol;
      card.dataset.index = index;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front"></div>
          <div class="card-face card-back">${symbol}</div>
        </div>
      `;

      card.addEventListener('click', () => handleCardClick(card));
      board.appendChild(card);
      return card;
    });

    startTimer();
  }

  function handleCardClick(card) {
    if (lockBoard) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if (flippedCards.length === 2) return;

    card.classList.add('flipped');
    flippedCards.push(card);

    if (flippedCards.length === 2) {
      moves++;
      movesEl.textContent = moves;
      checkMatch();
    }
  }

  function checkMatch() {
    const [first, second] = flippedCards;
    const isMatch = first.dataset.symbol === second.dataset.symbol;

    if (isMatch) {
      first.classList.add('matched');
      second.classList.add('matched');
      matchedCount++;
      pairsEl.textContent = matchedCount + '/' + symbols.length;
      flippedCards = [];

      if (matchedCount === symbols.length) {
        clearInterval(timerInterval);
        winMessage.textContent = `You matched all pairs in ${moves} moves and ${timer}s!`;
      }
    } else {
      lockBoard = true;
      setTimeout(() => {
        first.classList.remove('flipped');
        second.classList.remove('flipped');
        flippedCards = [];
        lockBoard = false;
      }, 800);
    }
  }

  restartBtn.addEventListener('click', createBoard);

  createBoard();
</script>

</body>
</html>
